<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Go 泛型约束与类型集合</title>
  <desc id="desc">展示 any、comparable、类型并集、近似类型和方法集如何共同收窄可用类型。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b2b"/><stop offset="1" stop-color="#0a3040"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#113c4c"/><stop offset="1" stop-color="#0c2635"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#001019" flood-opacity=".55"/></filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:30px;font-weight:700;fill:#eafcff}.sub{font-size:17px;fill:#9cc5cf}.code{font-family:"SFMono-Regular",Consolas,monospace;font-size:22px;fill:#d9faff}.label{font-size:20px;font-weight:650;fill:#fff}.small{font-size:16px;fill:#c4e3e9}.chip{font-size:16px;font-weight:650;fill:#06212d}
    </style>
  </defs>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/>
  <path d="M0 110H1200M0 220H1200M0 330H1200M0 440H1200M0 550H1200M150 0V650M300 0V650M450 0V650M600 0V650M750 0V650M900 0V650M1050 0V650" stroke="#46bed1" stroke-opacity=".055"/>
  <text x="64" y="70" class="title">约束不是“父类型”，而是一组候选类型</text>
  <text x="64" y="102" class="sub">编译器对集合做并集（|）、近似匹配（~）与交集（逐行嵌入）</text>

  <g filter="url(#shadow)">
    <rect x="64" y="142" width="410" height="438" rx="24" fill="url(#panel)" stroke="#44c7d7" stroke-opacity=".35"/>
    <text x="98" y="192" class="code">type Key interface {</text>
    <text x="126" y="236" class="code" fill="#69e7c0">comparable</text>
    <text x="126" y="280" class="code" fill="#ffbd70">~int | ~string</text>
    <text x="126" y="324" class="code" fill="#87d8ff">String() string</text>
    <text x="98" y="368" class="code">}</text>
    <path d="M98 410H438" stroke="#6bdbea" stroke-opacity=".25"/>
    <text x="98" y="450" class="small">每一行之间是 AND（交集）</text>
    <text x="98" y="484" class="small">同一行的 | 是 OR（并集）</text>
    <text x="98" y="518" class="small">~int 包含底层类型为 int 的命名类型</text>
    <text x="98" y="552" class="small">最终还必须具有 String 方法</text>
  </g>

  <g transform="translate(540 142)">
    <rect width="596" height="438" rx="24" fill="#071f2d" stroke="#44c7d7" stroke-opacity=".26"/>
    <rect x="30" y="28" width="536" height="374" rx="187" fill="#0d3544" stroke="#5dbccc" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="68" y="72" class="label">any</text>
    <ellipse cx="310" cy="231" rx="220" ry="132" fill="#12495a" stroke="#62d2dc" stroke-width="2"/>
    <text x="112" y="140" class="label">comparable</text>
    <ellipse cx="310" cy="247" rx="153" ry="89" fill="#155b62" stroke="#62e0c1" stroke-width="2"/>
    <text x="194" y="204" class="label">~int | ~string</text>
    <ellipse cx="310" cy="266" rx="88" ry="48" fill="#68e0bb" opacity=".95" filter="url(#glow)"/>
    <text x="263" y="272" class="chip">+ String()</text>
    <g transform="translate(103 338)">
      <rect width="110" height="38" rx="19" fill="#ffbd70"/><text x="25" y="25" class="chip">OrderID</text>
      <rect x="132" width="108" height="38" rx="19" fill="#87d8ff"/><text x="153" y="25" class="chip">UserKey</text>
      <rect x="262" width="126" height="38" rx="19" fill="#334d58"/><text x="281" y="25" class="small">int（无方法）</text>
    </g>
  </g>
</svg>
